{% extends "crmapp/base.html" %}

{% block title %}New Opportunity{% endblock %}

{% block content %}
<h2>New Opportunity</h2>
<form method="post" class="mt-3">
    {% csrf_token %}
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Stage</label>
            <select name="stage" class="form-select" required>
                {% for s in stages %}
                <option value="{{ s.pk }}">{{ s.name }} ({{ s.probability }}%)</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <div class="row mb-3">
        <div class="col-md-4">
            <label class="form-label">Company</label>
            <select name="company" class="form-select">
                <option value="">-- None --</option>
                {% for c in companies %}
                <option value="{{ c.pk }}">{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label">Contact</label>
            <select name="contact" class="form-select">
                <option value="">-- None --</option>
                {% for c in contacts %}
                <option value="{{ c.pk }}">{{ c.first_name }} {{ c.last_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label">Owner</label>
            <select name="owner" class="form-select">
                <option value="">-- None --</option>
                {% for u in users %}
                <option value="{{ u.pk }}">{{ u.username }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <div class="row mb-3">
        <div class="col-md-4">
            <label class="form-label">Value</label>
            <input type="number" name="value" class="form-control" step="0.01" min="0">
        </div>
        <div class="col-md-4">
            <label class="form-label">Expected Close Date</label>
            <input type="date" name="expected_close_date" class="form-control">
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="3"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Create</button>
    <a href="{% url 'crmapp:opportunity_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
