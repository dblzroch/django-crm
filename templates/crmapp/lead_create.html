{% extends "crmapp/base.html" %}

{% block title %}New Lead{% endblock %}

{% block content %}
<h2>New Lead</h2>
<form method="post" class="mt-3">
    {% csrf_token %}
    <div class="row">
        <div class="col-md-4 mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">Company</label>
            <select name="company" class="form-select">
                <option value="">-- None --</option>
                {% for c in companies %}
                <option value="{{ c.pk }}">{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">Contact</label>
            <select name="contact" class="form-select">
                <option value="">-- None --</option>
                {% for c in contacts %}
                <option value="{{ c.pk }}">{{ c.first_name }} {{ c.last_name }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <div class="row mb-3">
        <div class="col-md-4">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control">
        </div>
        <div class="col-md-4">
            <label class="form-label">Phone</label>
            <input type="tel" name="phone" class="form-control">
        </div>
        <div class="col-md-4">
            <label class="form-label">Source</label>
            <input type="text" name="source" class="form-control">
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label">Status</label>
        <select name="status" class="form-select">
            {% for val, label in lead_statuses %}
            <option value="{{ val }}">{{ label }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Owner</label>
        <select name="owner" class="form-select">
            <option value="">-- None --</option>
            {% for u in users %}
            <option value="{{ u.pk }}">{{ u.username }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Notes</label>
        <textarea name="notes" class="form-control" rows="3"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Create</button>
    <a href="{% url 'crmapp:lead_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
